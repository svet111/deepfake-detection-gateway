<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Deepfake Gateway</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 500px; margin: 4rem auto; }
        .box { border: 1px solid #ccc; padding: 1.5rem; border-radius: 8px; }
        pre { background: #f4f4f4; padding: 1rem; border-radius: 4px; }
    </style>
</head>
<body>
<div class="box">
    <h2>Deepfake Scanner</h2>
    <input type="file" id="fileInput" />
    <button onclick="uploadFile()">Scan File</button>
    <pre id="result">Select a file to scan...</pre>
</div>

<script>
    async function uploadFile() {
      const file = document.getElementById("fileInput").files[0];
      if (!file) return alert("Choose a file first.");

      const formData = new FormData();
      formData.append("file", file);

      const res = await fetch("/api/v1/scans", { method: "POST", body: formData });
      const data = await res.json();
      document.getElementById("result").textContent = JSON.stringify(data, null, 2);
    }
</script>
</body>
</html>
